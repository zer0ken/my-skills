<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK KR, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b84d8"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <pattern id="fade" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fde7dc"/><rect width="4" height="8" fill="#f9cdb7"/></pattern>
  </defs>
  <rect x="1" y="1" width="958" height="598" rx="18" fill="#fff" stroke="#e5e7eb"/>

  <text x="36" y="52" font-size="24" font-weight="700" fill="#111827">강제 종료된 시험 실행의 컨테이너</text>
  <text x="36" y="80" font-size="14" fill="#6b7280">unit 시험 runner 를 SIGKILL 한 뒤 그 실행의 컨테이너 수명과 CPU 사용, main 대비 이 PR</text>

  <!-- time axis -->
  <g font-size="12" fill="#6b7280">
    <line x1="170" y1="118" x2="790" y2="118" stroke="#d1d5db"/>
    <text x="170" y="108" text-anchor="middle" fill="#dc2626" font-weight="700">0초 SIGKILL</text>
    <text x="250" y="108" text-anchor="middle">10초</text>
    <text x="410" y="108" text-anchor="middle">30초</text>
    <text x="490" y="108" text-anchor="middle">40초</text>
    <text x="650" y="108" text-anchor="middle">60초</text>
    <text x="760" y="108" text-anchor="middle">3분</text>
    <path d="M690,112 l6,12 M700,112 l6,12" stroke="#9ca3af"/>
    <g stroke="#e5e7eb" stroke-dasharray="3 4">
      <line x1="250" y1="122" x2="250" y2="470"/><line x1="410" y1="122" x2="410" y2="470"/>
      <line x1="490" y1="122" x2="490" y2="470"/><line x1="760" y1="122" x2="760" y2="470"/>
    </g>
    <line x1="170" y1="122" x2="170" y2="470" stroke="#dc2626" stroke-width="2"/>
  </g>

  <!-- AS-IS lane -->
  <text x="36" y="140" font-size="13" font-weight="700" fill="#111827">AS-IS <tspan font-weight="400" fill="#6b7280">· main ae292f7</tspan></text>
  <rect x="110" y="150" width="60" height="22" rx="4" fill="#e5e7eb"/>
  <text x="140" y="165" font-size="11" text-anchor="middle" fill="#374151">runner</text>
  <text x="170" y="168" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">✕</text>
  <rect x="110" y="184" width="650" height="30" rx="6" fill="#fbe1d4" stroke="#ea580c"/>
  <rect x="760" y="184" width="40" height="30" fill="url(#fade)"/>
  <line x1="760" y1="199" x2="830" y2="199" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="122" y="204" font-size="13" fill="#7c2d12" font-weight="700">unit 컨테이너</text>
  <text x="505" y="204" font-size="13" fill="#7c2d12">runner 가 죽어도 계속 실행</text>
  <text x="196" y="238" font-size="12" fill="#6b7280">회수할 프로세스 없음</text>
