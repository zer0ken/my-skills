  <!-- TO-BE lane -->
  <text x="36" y="292" font-size="13" font-weight="700" fill="#0b84d8">TO-BE <tspan font-weight="400" fill="#6b7280">· 이 PR 374ddd4</tspan></text>
  <rect x="110" y="304" width="60" height="22" rx="4" fill="#e5e7eb"/>
  <text x="140" y="319" font-size="11" text-anchor="middle" fill="#374151">runner</text>
  <text x="170" y="322" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">✕</text>
  <rect x="110" y="336" width="380" height="30" rx="6" fill="#e0f0fb" stroke="#0b84d8"/>
  <text x="122" y="356" font-size="13" fill="#0c4a6e" font-weight="700">unit 컨테이너</text>
  <rect x="110" y="392" width="380" height="26" rx="6" fill="#ffffff" stroke="#0b84d8" stroke-dasharray="4 3"/>
  <text x="122" y="410" font-size="12" fill="#0c4a6e">Ryuk: 실행마다 하나, runner 연결이 끊기면 회수 시작</text>
  <path d="M470,392 C470,378 478,372 486,368" fill="none" stroke="#0b84d8" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#0b84d8"><circle cx="250" cy="351" r="5"/><circle cx="410" cy="351" r="5"/></g>
  <circle cx="490" cy="351" r="6" fill="#fff" stroke="#0b84d8" stroke-width="2"/>
  <text x="502" y="347" font-size="13" fill="#0b84d8" font-weight="700">40초: 컨테이너·Ryuk 모두 삭제</text>
  <text x="502" y="365" font-size="12" fill="#6b7280">이후 남은 것 없음</text>

