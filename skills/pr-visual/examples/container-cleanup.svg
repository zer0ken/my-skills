  <!-- takeaway -->
  <line x1="36" y1="500" x2="924" y2="500" stroke="#f3f4f6"/>
  <text x="36" y="534" font-size="19" font-weight="700" fill="#111827">죽은 시험의 컨테이너가 3분 넘게 남던 것이 40초 안에 사라지고, 사는 동안 4코어만 쓴다</text>
  <text x="36" y="568" font-size="11" fill="#9ca3af">입력: jupiter06, 11-17 20:35 같은 시각에 main ae292f7 과 이 PR 374ddd4 의 unit 실행 runner 에 SIGKILL. 10초 간격으로 project 라벨 컨테이너 수와 NanoCpus 를 조회.</text>
